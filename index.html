<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の確認テスト</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 860px; margin: 30px auto; padding: 20px; background: #f8fafc; color: #0f172a; line-height: 2.2; font-size: 1.1rem; }
    .card { background: #ffffff; padding: 32px; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h1 { font-size: 1.6rem; margin-bottom: 16px; color: #1e3a8a; border-bottom: 3px solid #2563eb; padding-bottom: 8px; }
    .name-box { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
    .name-box input { padding: 6px 12px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; width: 220px; }
    .student-input { border: 2px solid #94a3b8; border-radius: 6px; padding: 4px 10px; font-size: 1rem; width: 140px; text-align: center; font-weight: bold; margin: 0 4px; }
    .student-select { border: 2px solid #0284c7; border-radius: 6px; padding: 4px 10px; font-size: 1rem; font-weight: bold; background: #f0f9ff; color: #0369a1; cursor: pointer; margin: 0 4px; }
    .student-input.correct, .student-select.correct { border-color: #16a34a; background: #dcfce7; color: #15803d; }
    .student-input.incorrect, .student-select.incorrect { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
    .btn-group-student { display: flex; gap: 12px; margin-top: 28px; }
    .btn-submit { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; flex: 2; }
    .btn-print { background: #64748b; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
    #scoreBox { margin-top: 20px; padding: 16px; border-radius: 8px; text-align: center; font-size: 1.3rem; font-weight: bold; display: none; }
    .score-good { background: #dcfce7; color: #166534; border: 2px solid #86efac; }
    .answer-key { font-size: 0.85rem; color: #dc2626; font-weight: bold; margin-left: 4px; }
    .btn-save-result { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px; width: 100%; display: none; }
    
    /* 印刷用レイアウト切替用CSS (@media print) */
    @media print {
      body { background: #fff; margin: 0; padding: 0; }
      .card { border: none; box-shadow: none; padding: 0; }
      .btn-group-student, .btn-save-result, #scoreBox { display: none !important; }
      .student-input, .student-select { border: none; border-bottom: 2px solid #000; background: transparent; color: transparent; width: 120px; display: inline-block; text-align: center; }
      .student-select option { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 今日の確認テスト</h1>
    <div class="name-box">
      氏名: <input type="text" id="studentName" placeholder="名前を入力してください">
    </div>
    <div id="historyNotice" style="font-size:0.85rem; color:#64748b; margin-bottom:12px;"></div>
    <div id="testBody"><span><select class="student-select" data-answer="コンテンツ" id="q_0"><option value="">[ 1 選択 ]</option><option value="コンテンツ">コンテンツ</option><option value="双方向">双方向</option><option value="指向性">指向性</option><option value="ジャンル">ジャンル</option></select></span>とは、目的に応じて、文字や音声、静止画、動画などを組み合わせて表現された情報を指します。<span><select class="student-select" data-answer="双方向" id="q_1"><option value="">[ 2 選択 ]</option><option value="双方向">双方向</option><option value="コンテンツ">コンテンツ</option><option value="指向性">指向性</option><option value="情報">情報</option></select></span>とは、使用者の働きかけ（<span><select class="student-select" data-answer="入力" id="q_2"><option value="">[ 3 選択 ]</option><option value="入力">入力</option><option value="出力">出力</option><option value="記憶">記憶</option><option value="制御">制御</option></select></span>）に応じて、応答（<span><select class="student-select" data-answer="出力" id="q_3"><option value="">[ 4 選択 ]</option><option value="出力">出力</option><option value="入力">入力</option><option value="記憶">記憶</option><option value="演算">演算</option></select></span>）する機能のことを言います。<br>受信者・送信者がメッセージを送ったり、受け取ったりしてメッセージのやりとりが出来るようなシステムのことを、「<span><input type="text" class="student-input" data-answer="チャットシステム" id="q_4" placeholder="[ 5 ]"></span>」と言います。</div>
    
    <div class="btn-group-student">
      <button class="btn-submit" onclick="checkAnswers()">採点する</button>
      <button class="btn-print" onclick="window.print()">🖨️ 印刷</button>
    </div>
    
    <div id="scoreBox"></div>
    <button id="saveResultBtn" class="btn-save-result" onclick="exportResultJSON()">💾 解答結果をファイルに保存（提出用）</button>
  </div>

  <script>
    let lastResultData = null;

    window.addEventListener('DOMContentLoaded', () => {
      // 選択肢の自動ランダムシャッフル
      const selects = document.querySelectorAll('.student-select');
      selects.forEach(select => {
        const options = Array.from(select.querySelectorAll('option')).slice(1);
        for (let i = options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [options[i], options[j]] = [options[j], options[i]];
        }
        options.forEach(opt => select.appendChild(opt));
      });

      // LocalStorageからの過去の得点履歴の読み込み
      const savedHistory = localStorage.getItem('history_今日の確認テスト');
      if (savedHistory) {
        const hist = JSON.parse(savedHistory);
        document.getElementById('historyNotice').innerText = '前回の記録: ' + hist.date + ' [' + hist.score + ']';
      }
    });

    function checkAnswers() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('採点する前に氏名を入力してください。');
        return;
      }

      const inputs = document.querySelectorAll('.student-input, .student-select');
      let correctCount = 0;
      const details = [];

      inputs.forEach((input, idx) => {
        const userAns = input.value.trim();
        const targetAns = input.dataset.answer.trim();
        const isCorrect = (userAns === targetAns);

        const existingKey = input.parentNode.querySelector('.answer-key');
        if (existingKey) existingKey.remove();

        if (isCorrect) {
          input.className = input.classList.contains('student-input') ? 'student-input correct' : 'student-select correct';
          correctCount++;
        } else {
          input.className = input.classList.contains('student-input') ? 'student-input incorrect' : 'student-select incorrect';
          const keySpan = document.createElement('span');
          keySpan.className = 'answer-key';
          keySpan.innerText = ' [正解: ' + targetAns + ']';
          input.parentNode.appendChild(keySpan);
        }

        details.push({ qNo: idx + 1, userAns: userAns, targetAns: targetAns, isCorrect: isCorrect });
      });

      const scoreStr = inputs.length + '問中 ' + correctCount + '問正解 (' + Math.round((correctCount / inputs.length) * 100) + '点)';
      const scoreBox = document.getElementById('scoreBox');
      scoreBox.style.display = 'block';
      scoreBox.className = 'score-good';
      scoreBox.innerText = '採点結果: ' + scoreStr;

      // 解答履歴データ作成
      lastResultData = {
        title: "今日の確認テスト",
        studentName: name,
        date: new Date().toLocaleString('ja-JP'),
        score: scoreStr,
        totalQuestions: inputs.length,
        correctCount: correctCount,
        details: details
      };

      // LocalStorage保存
      localStorage.setItem('history_今日の確認テスト', JSON.stringify({ score: scoreStr, date: lastResultData.date }));
      document.getElementById('saveResultBtn').style.display = 'block';
    }

    // 解答結果のJSONエクスポート保存 (Blob)
    function exportResultJSON() {
      if (!lastResultData) return;
      const jsonStr = JSON.stringify(lastResultData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '[解答結果]' + lastResultData.title + '_' + lastResultData.studentName + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
